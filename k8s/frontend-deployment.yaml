apiVersion: apps/v1
kind: Deployment
metadata:
  name: boutique-ai-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: boutique-ai-frontend
  template:
    metadata:
      labels:
        app: boutique-ai-frontend
    spec:
      containers:
      - name: boutique-ai-frontend
        image: gcr.io/vertex-ai-experminent/boutique-ai-frontend:latest
        ports:
        - containerPort: 3000
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: boutique-ai-frontend
spec:
  selector:
    app: boutique-ai-frontend
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
