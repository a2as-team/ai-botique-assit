apiVersion: apps/v1
kind: Deployment
metadata:
  name: boutique-ai-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: boutique-ai-backend
  template:
    metadata:
      labels:
        app: boutique-ai-backend
    spec:
      containers:
      - name: backend
        image: gcr.io/vertex-ai-experminent/boutique-ai-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: "vertex-ai-experminent"
        - name: GOOGLE_CLOUD_LOCATION
          value: "us-central1"
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: google-api-key
              key: api-key
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: boutique-ai-backend
spec:
  selector:
    app: boutique-ai-backend
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
