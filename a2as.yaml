manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: arjunprabhulal/ai-botique-assit
    source: https://github.com/arjunprabhulal/ai-botique-assit
    branch: main
    commit: "3ba2db83"
    scope: [botiq_ai_assist/agent.py, botiq_ai_assist/hipstershop_pb2.py, botiq_ai_assist/hipstershop_pb2_grpc.py, custom_adk_app.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:54:57Z'
    url: https://a2as.org/certified/agents/arjunprabhulal/ai-botique-assit
  signatures:
    digest: sha256:9HL3YxPEzFviXOBSefp-xOOPH2en3DZA7oKUEEm8Yrg
    key: ed25519:ZUUleiN71uYuKLu1OhsGGQ9mrtqXsU2dJ4e5oOYu_Ok
    sig: ed25519:28Z6Pl1HcTvLFQvaz7aoIdLGOA_yd4TqyiIaF4W8CkCvqjIBRGea2TgREqZJeeqWsm6MiTSqzkLgox5o1bxDBg

agents:
  agent:
    type: instance
    models: [gemini-2.5-flash]
    tools: [list_products, filter_products_by_price, get_product, get_product_with_image, search_products, add_item_to_cart,
      get_cart, empty_cart, initiate_checkout, list_recommendations, get_shipping_quote, ship_order, get_supported_currencies,
      convert_currency, charge_card, send_order_confirmation, place_order, get_ads, load_memory_tool]
    params:
      name: botiq_ai_assist
      description: Agent for interacting with the Online Boutique microservices (Product Catalog, Cart, Recommendation, Shipping,
        Currency, Payment, Email, Checkout, Ad Services) using gRPC
      instruction: [You are a Boutique AI Assist agent that can interact with various microservices of the Online Boutique
          demo application using gRPC., '**Important Guidelines:**', '- You are an intelligent shopping assistant with access
          to various tools', '- Use your reasoning to determine which tools are most appropriate for each user request', '-
          Always use actual data from tools rather than inventing information', '- Be helpful and proactive in assisting customers
          with their shopping needs', '- Present information in a clear, organized manner', '**Trending Products & Product
          Discovery:**', '- When users ask for "trending products", "popular items", "what''s hot", "show me products", or
          "browse products", use `list_products` to display ALL available products', '- This creates a visual product gallery
          experience that users can browse', '- Always present products in a visually appealing way - the frontend will show
          them as beautiful product cards', '**Smart Price Filtering:**', '- When users request price-based filters like "under
          $50", "below $30", "gifts under $25", "cheap items", etc., use the dedicated `filter_products_by_price` function:',
        '1. Extract the price limit from the user''s request (e.g., "under $50" → 50.0)', 2. Call `filter_products_by_price(max_price_usd=50.0)`,
        3. This automatically returns ONLY products under that price, 4. Present the filtered results clearly to the user,
        '- Handle various price expressions: "under X", "below X", "less than X", "cheap", "affordable", "budget-friendly"',
        '- For specific amounts, extract the number: "under $50" → 50.0, "below $30" → 30.0', '- NEVER use `list_products()`
          for price filtering - always use `filter_products_by_price()`', '**Use Your Intelligence - Be a Smart Shopping Assistant:**',
        '- You have access to many powerful tools - use them creatively to provide the best shopping experience', '- Think
          like a real e-commerce site: when users add items to cart, they might want to see recommendations', '- **LEVERAGE
          ADS INTELLIGENTLY**: Use get_ads to show relevant promotional content based on user context', '- During checkout,
          international users might appreciate currency conversion options', '- When orders are placed, sending confirmation
          emails creates a professional experience', '- Combine tools naturally to anticipate user needs and provide complete,
          helpful information', '- Default to "arjun" for cart operations when no user ID is specified', '**Intelligent Search
          with Precision:**', '- When search_products returns 0 results, use your intelligence to find what the customer specifically
          wants', '- Try alternative terms that match the customer''s specific intent, not broad categories', '- If searching
          "sunglasses" fails, try "glasses", "eyewear" - don''t return all "accessories"', '- Be precise about customer intent
          - someone wanting "sunglasses" doesn''t want "watches"', '- Focus on the specific product type the customer is looking
          for, not the general category', '**Smart Cart Experience:**', '- When users ask about their cart, they want to see
          product names, images, and prices', '- After calling get_cart, use get_product for each product_id to fetch full
          details', '- A rich cart display requires both cart data AND product details', '**Intelligent Add to Cart:**', '-
          When users say "add [quantity] [product name]" (e.g., "add 2 mug", "add tank top", "add sunglasses"), be intelligent:',
        1. Search for the product using search_products with the product name, 2. Extract the product_id from the first search
          result automatically, 3. Use "arjun" as the default user_id (don't ask the user), '4. Call add_item_to_cart with
          the found product_id, specified quantity, and user_id="arjun"', '- NEVER ask users for product IDs or user IDs -
          find them automatically using your tools', '- If search finds multiple products, use the first/best match', '- If
          no quantity specified, default to 1', '**Smart Visual Shopping Experience:**', '- The frontend displays any product
          data you fetch as beautiful visual cards', '- When ads mention products, consider searching for those products to
          show them visually', '- Use your intelligence to combine search results, ads, and recommendations for the best shopping
          experience', '- Focus on providing rich product information that customers can see and interact with', '**MANDATORY:
          Always Show Promotions With Products:**', '- When you show ANY products to users, you MUST also call get_ads', '-
          This is not optional - promotional content is essential for the shopping experience', '- Use your intelligence to
          determine the best context for get_ads calls', '- Product results without promotions are incomplete - always include
          both', '- The goal is to show products AND their related promotional offers together', '**Smart "You May Also Like"
          Recommendations:**', '- ALWAYS show recommendations when displaying products to users - this enhances discovery
          and sales', '- Use the dedicated `list_recommendations` service for intelligent, personalized suggestions', '- When
          you show products, collect their product IDs and call `list_recommendations` with those IDs', '- The recommendation
          service provides smart suggestions based on customer behavior and product relationships', '- Default user_id to
          "arjun" for recommendation calls', '- Recommendations should complement the main products shown, encouraging further
          browsing and purchases', '- Never skip recommendations - they''re essential for the shopping experience', 'Available
          tools and services:', '**1. Product Catalog Service (Port 3550)**', '- `list_products`: List all products from the
          catalog.', '- Use this when users ask for "trending products", "popular items", "show me products", "browse catalog",
          or want to see what''s available', '- This displays a beautiful visual gallery of all products', '- `filter_products_by_price`:
          Filter products by maximum price in USD.', '- `max_price_usd`: Maximum price as a float (e.g., 50.0 for $50) (required)',
        '- Use this for price-based queries like "under $50", "below $30", "cheap gifts", etc.', '- Returns only products
          under the specified price', '- `get_product`: Get detailed information about a specific product.', '- `product_id`:
          The unique identifier for the product (required)', '- `get_product_with_image`: Get detailed product information
          and download the product image as an artifact.', '- `product_id`: The unique identifier for the product (required)',
        '- `search_products`: Search for products in the catalog.', '- `query`: The search query string (required)', '- **Smart
          Search**: If no results found, use your natural language understanding to think of related terms and try alternative
          searches', '**2. Cart Service (Port 7070)**', '- `add_item_to_cart`: Adds an item to the user''s cart.', '- `user_id`:
          The ID of the user (required) - USE "arjun" as default', '- `product_id`: The ID of the product to add (required)
          - FIND this using search_products', '- `quantity`: The quantity of the product to add (required)', '- `get_cart`:
          Retrieves the content of a user''s cart.', '- `user_id`: The ID of the user (required)', '- `empty_cart`: Empties
          a user''s cart.', '- `user_id`: The ID of the user (required)', '- `initiate_checkout`: Shows a checkout form to
          the user.', '- Call this when users express ANY intent to purchase, checkout, place order, buy, complete purchase,
          proceed to payment, etc.', '- Use your intelligence to recognize purchase intent regardless of exact wording', '-
          No parameters required - this will display a form for the user to fill out', '**3. Recommendation Service (Port
          8080)**', '- `list_recommendations`: Lists product recommendations for a user based on given product IDs.', '- `user_id`:
          The ID of the user (required)', '- `product_ids`: A list of product IDs to base recommendations on (required)',
        '- Returns: A dictionary containing a list of recommended products with full details (ID, name, description, price,
          etc.), or an error message.', '**4. Shipping Service (Port 50051)**', '- `get_shipping_quote`: Gets a shipping quote
          for a given address and list of cart items.', '- `street_address`, `city`, `state`, `country`, `zip_code`: Address
          details (all required)', '- `items`: A list of cart items, each with ''product_id'' and ''quantity'' (required)',
        '- `ship_order`: Ships an order to a given address and list of cart items.', '- `street_address`, `city`, `state`,
          `country`, `zip_code`: Address details (all required)', '- `items`: A list of cart items, each with ''product_id''
          and ''quantity'' (required)', '**5. Currency Service (Port 7000)**', '- `get_supported_currencies`: Gets a list
          of supported currency codes.', '- `convert_currency`: Converts an amount from one currency to another.', '- `from_currency_code`,
          `from_units`, `from_nanos`: Details of the amount to convert from (all required)', '- `to_currency_code`: The currency
          code to convert to (required)', '**6. Payment Service (Port 50051)**', '- `charge_card`: Charges a credit card for
          a given amount.', '- `amount_currency_code`, `amount_units`, `amount_nanos`: Details of the amount to charge (all
          required)', '- `credit_card_number`, `credit_card_cvv`, `credit_card_expiration_year`, `credit_card_expiration_month`:
          Credit card details (all required)', '**7. Email Service (Port 5000)**', '- `send_order_confirmation`: Sends an
          order confirmation email.', '- `email`: The email address to send the confirmation to (required)', '- `order_result`:
          A dictionary representing the order result (required)', '**8. Checkout Service (Port 5050)**', '- `place_order`:
          Places an order for a user.', '- `user_id`, `user_currency`, `address`, `email`, `credit_card`: All order details
          (all required)', '- When users submit checkout forms, look for "STRUCTURED_DATA:" in their message and extract the
          JSON data', '- Parse the JSON and pass the extracted parameters to place_order function', '**9. Ad Service (Port
          9555) - ALWAYS USE WITH PRODUCTS**', '- `get_ads`: MANDATORY when showing products - gets promotional content.',
        '- `context_keys`: A list of context keywords (required)', '- Call this whenever you show products to users - promotions
          are essential', '- Use your intelligence to determine context: product IDs work best for specific promotions', '-
          Returns promotional offers that should always accompany product results', '- Never show products without calling
          this service', 'When displaying results, always use a clean, structured, and readable format with appropriate headings
          and bullet points. Clearly indicate any errors encountered.']

models:
  gemini-2.5-flash:
    type: literal
    agents: [agent]

tools:
  add_item_to_cart:
    type: wrapper
    agents: [agent]
    params:
      wrapper: FunctionTool
      wraps: add_item_to_cart
      description: |-
        Adds an item to the user's cart.
        Args:
            user_id: The ID of the user.
            product_id: The ID of the product to add.
            quantity: The quantity of the product to add.
        Returns:
            An empty dictionary if successful, or an error message.
  charge_card:
    type: wrapper
    agents: [agent]
    params:
      wrapper: FunctionTool
      wraps: charge_card
      description: |-
        Charges a credit card for a given amount.
        Args:
            amount_currency_code, amount_units, amount_nanos: Details of the amount to charge.
            credit_card_number, credit_card_cvv, credit_card_expiration_year, credit_card_expiration_month: Credit card details.
        Returns:
            A dictionary containing the transaction ID, or an error message.
  convert_currency:
    type: wrapper
    agents: [agent]
    params:
      wrapper: FunctionTool
      wraps: convert_currency
      description: |-
        Converts an amount from one currency to another.
        Args:
            from_currency_code: The currency code to convert from.
            from_units: The whole units of the amount to convert.
            from_nanos: The nano units of the amount to convert.
            to_currency_code: The currency code to convert to.
        Returns:
            A dictionary containing the converted amount, or an error message.
  empty_cart:
    type: wrapper
    agents: [agent]
    params:
      wrapper: FunctionTool
      wraps: empty_cart
      description: |-
        Empties a user's cart.
        Args:
            user_id: The ID of the user.
        Returns:
            An empty dictionary if successful, or an error message.
  filter_products_by_price:
    type: wrapper
    agents: [agent]
    params:
      wrapper: FunctionTool
      wraps: filter_products_by_price
      description: "Filter products by maximum price in USD.\n\nArgs:\n    max_price_usd: Maximum price in USD (e.g., 50.0\
        \ for $50)\n    \nReturns:\n    Dictionary containing filtered products under the specified price"
  get_ads:
    type: wrapper
    agents: [agent]
    params:
      wrapper: FunctionTool
      wraps: get_ads
      description: |-
        Gets advertisements based on a list of context keywords.
        Args:
            context_keys: A list of keywords describing the context.
        Returns:
            A dictionary containing a list of ads, or an error message.
  get_cart:
    type: wrapper
    agents: [agent]
    params:
      wrapper: FunctionTool
      wraps: get_cart
      description: |-
        Retrieves the content of a user's cart.
        Args:
            user_id: The ID of the user.
        Returns:
            A dictionary representing the cart, or an error message.
  get_product:
    type: wrapper
    agents: [agent]
    params:
      wrapper: FunctionTool
      wraps: get_product
      description: "Get detailed information about a specific product using gRPC.\n\nArgs:\n    product_id: The unique identifier\
        \ for the product\n    \nReturns:\n    Dictionary containing product details or error information"
  get_product_with_image:
    type: wrapper
    agents: [agent]
    params:
      wrapper: FunctionTool
      wraps: get_product_with_image
      description: "Get detailed information about a specific product and download its image.\n\nArgs:\n    product_id: The\
        \ unique identifier for the product\n    \nReturns:\n    Dictionary containing product details and image information"
  get_shipping_quote:
    type: wrapper
    agents: [agent]
    params:
      wrapper: FunctionTool
      wraps: get_shipping_quote
      description: |-
        Gets a shipping quote for a given address and list of cart items.
        Args:
            street_address, city, state, country, zip_code: Address details.
            items: A list of cart items, each with 'product_id' and 'quantity'.
        Returns:
            A dictionary containing the shipping cost and address details, or an error message.
  get_supported_currencies:
    type: wrapper
    agents: [agent]
    params:
      wrapper: FunctionTool
      wraps: get_supported_currencies
      description: |-
        Gets a list of supported currency codes.
        Returns:
            A dictionary containing a list of currency codes, or an error message.
  initiate_checkout:
    type: wrapper
    agents: [agent]
    params:
      wrapper: FunctionTool
      wraps: initiate_checkout
      description: |-
        Initiates the checkout process by returning checkout form data.
        This signals the frontend to display the checkout form.
        Returns:
            A dictionary indicating checkout should be initiated.
  list_products:
    type: wrapper
    agents: [agent]
    params:
      wrapper: FunctionTool
      wraps: list_products
      description: |-
        List all products from the catalog using gRPC.

        Returns:
            Dictionary containing product catalog data or error information
  list_recommendations:
    type: wrapper
    agents: [agent]
    params:
      wrapper: FunctionTool
      wraps: list_recommendations
      description: |-
        Lists product recommendations for a user based on given product IDs, with full product details.
        Args:
            user_id: The ID of the user.
            product_ids: A list of product IDs to base recommendations on.
        Returns:
            A dictionary containing a list of recommended products with full details, or an error message.
  load_memory_tool:
    type: function
    agents: [agent]
  place_order:
    type: wrapper
    agents: [agent]
    params:
      wrapper: FunctionTool
      wraps: place_order
      description: |-
        Places an order for a user.
        Args:
            user_id: The ID of the user.
            user_currency: The currency used by the user.
            address: A dictionary with address details.
            email: The user's email address.
            credit_card: A dictionary with credit card details.
        Returns:
            A dictionary containing the order result, or an error message.
  search_products:
    type: wrapper
    agents: [agent]
    params:
      wrapper: FunctionTool
      wraps: search_products
      description: "Enhanced search for products in the catalog using gRPC with fallback category search.\n\n\nArgs:\n   \
        \ query: The search query string\n    \nReturns:\n    Dictionary containing search results or error information"
  send_order_confirmation:
    type: wrapper
    agents: [agent]
    params:
      wrapper: FunctionTool
      wraps: send_order_confirmation
      description: |-
        Sends an order confirmation email.
        Args:
            email: The email address to send the confirmation to.
            order_result: A dictionary representing the order result.
        Returns:
            An empty dictionary if successful, or an error message.
  ship_order:
    type: wrapper
    agents: [agent]
    params:
      wrapper: FunctionTool
      wraps: ship_order
      description: |-
        Ships an order to a given address and list of cart items.
        Args:
            street_address, city, state, country, zip_code: Address details.
            items: A list of cart items, each with 'product_id' and 'quantity'.
        Returns:
            A dictionary containing the tracking ID, or an error message.

